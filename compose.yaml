services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: routepulse
      POSTGRES_USER: routeuser
      POSTGRES_PASSWORD: ${DB_PASS:-local-only-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeuser -d routepulse"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./functions.sql:/docker-entrypoint-initdb.d/02-functions.sql:ro
      - ./views.sql:/docker-entrypoint-initdb.d/03-views.sql:ro
      - ./sample_data.sql:/docker-entrypoint-initdb.d/04-sample_data.sql:ro
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:6379:6379"
  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: routepulse
      DB_USER: routeuser
      DB_PASS: ${DB_PASS:-local-only-password}
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
volumes:
  pgdata:
